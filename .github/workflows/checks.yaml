name: Checks

on:
  pull_request:
  push:
    branches:
      - main

# Cancel any ongoing previous run if a PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  pre-commit:
    name: Linting and Formatting
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/lfs-cached-checkout
    - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6

  reuse:
    name: Licensing information
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        cache-dependency-glob: ".github/workflows/checks.yaml"
    - name: Check REUSE compliance
      shell: bash
      run: |
        set -o pipefail
        uv run --with reuse reuse lint | tee $GITHUB_STEP_SUMMARY
