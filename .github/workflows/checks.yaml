name: Checks

on:
  pull_request:
  push:
    branches:
      - main

# Cancel any ongoing previous run if a PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  pre-commit:
    name: Linting and Formatting
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/lfs-cached-checkout
    - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  reuse:
    name: Licensing information
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        cache-dependency-glob: ".github/workflows/checks.yaml"
    - name: Check REUSE compliance
      shell: bash
      run: |
        set -o pipefail
        uv run --with reuse reuse lint | tee $GITHUB_STEP_SUMMARY
