# The gdscript-formatter hook uses language: mise, added in prek 0.4.13.
minimum_prek_version: "0.4.13"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --enforce-all
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            ^scenes/quests/story_quests/(?!stella/)
            |
            \.import$
          )
        exclude_types: [svg, piskel]
      - id: trailing-whitespace
        exclude: |
          (?x)(
            ^scenes/quests/story_quests/(?!stella/)
            |
            \.import$
          )
        exclude_types: [svg, piskel]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.4.0
    hooks:
      - id: editorconfig-checker
        exclude: |
          (?x)^(
            scenes/quests/story_quests/(?!stella/)
          )

  - repo: local
    hooks:
      - id: check-image-size
        name: check image dimensions
        entry: python tools/check-image-size.py
        language: python
        additional_dependencies: [Pillow]
        types_or: [png, jpeg, webp]

      # The upstream hook builds the formatter from source, which needs a Rust
      # and C toolchain. Download the release binary through mise instead.
      - id: gdscript-formatter
        name: gdscript-formatter
        language: mise
        additional_dependencies:
          - github:GDQuest/GDScript-formatter[bin=gdscript-formatter]@0.27.0
        # --verify-structure leaves a file untouched if formatting would change
        # the meaning of the code.
        entry: gdscript-formatter --verify-structure
        types: [gdscript]
        exclude: |
          (?x)^(
            scenes/quests/story_quests/(?!stella/)
          )

      # Only runs when asked for, to fix the class-definitions-order errors
      # from gdlint:
      #   prek run --hook-stage manual gdscript-reorder --files <file>
      # --verify-structure can't be used here, because moving definitions
      # changes the structure.
      - id: gdscript-reorder
        name: gdscript-formatter --reorder-code
        language: mise
        additional_dependencies:
          - github:GDQuest/GDScript-formatter[bin=gdscript-formatter]@0.27.0
        entry: gdscript-formatter --reorder-code
        types: [gdscript]
        stages: [manual]
        exclude: |
          (?x)^(
            scenes/quests/story_quests/(?!stella/)
          )

  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdlint
        exclude: |
          (?x)^(
            script_templates/|
            scenes/quests/story_quests/(?!stella/)
          )

exclude: |
  (?x)^(
    addons/dialogue_manager/(.*)|
    addons/input_helper/(.*)|
    addons/phantom_camera/(.*)|
  )$
